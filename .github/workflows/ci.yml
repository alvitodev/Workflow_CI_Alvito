name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install mlflow==2.19.0 pandas scikit-learn

      - name: Run MLflow Project
        run: |
          cd MLProject_Dir
          rm -rf mlruns/
          mlflow run . --env-manager=local

      - name: Build Docker Image using MLflow
        run: |
          cd MLProject_Dir
          RUN_ID=$(ls mlruns/0 | grep -v meta.yaml | head -n 1)
          echo "Run ID yang didapat: $RUN_ID"
          
          # 1. Ekstrak Dockerfile (Pengganti sementara untuk 'mlflow models build-docker' yang nge-bug)
          mlflow models generate-dockerfile -m mlruns/0/$RUN_ID/artifacts/model -d docker_build_dir
          
          # 2. [PATCH] Perbaiki URL get-pip.py yang error ke versi arsip khusus Python 3.9
          sed -i 's|https://bootstrap.pypa.io/get-pip.py|https://bootstrap.pypa.io/pip/3.9/get-pip.py|g' docker_build_dir/Dockerfile
          
          # 3. Build Docker Image
          cd docker_build_dir
          docker build -t ${{ secrets.DOCKER_USERNAME }}/telco-model:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/telco-model:latest

      - name: Upload Artifacts to GitHub (Save to Repository)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject_Dir/mlruns/