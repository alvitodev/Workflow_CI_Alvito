name: MLOps CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install mlflow==2.19.0 pandas scikit-learn

      - name: Run MLflow Project
        run: |
          cd MLProject_Dir
          rm -rf mlruns/
          mlflow run . --env-manager=local

      - name: Build Docker Image using MLflow
        run: |
          cd MLProject_Dir
          # Mengambil ID Run dari hasil training barusan
          RUN_ID=$(ls mlruns/0 | grep -v meta.yaml | head -n 1)
          echo "Run ID yang didapat: $RUN_ID"
          
          # Membangun Docker Image menggunakan fitur bawaan MLflow
          mlflow models build-docker -m mlruns/0/$RUN_ID/artifacts/model -n ${{ secrets.DOCKER_USERNAME }}/telco-model:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/telco-model:latest

      - name: Upload Artifacts to GitHub (Save to Repository)
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject_Dir/mlruns/